# Per-agent model choice, one row per runtime.
# claude: alias read directly by Claude Code's own agents/*.md frontmatter (not regenerated).
# pi:     provider/model written into the generated .pi/agents/*.md by setup_pie.sh.
#         "gwdg/<id>" needs GWDG_API_KEY in .env; setup_pie.sh registers the provider
#         and all ids below in ~/.pi/agent/models.json. Swap the id per row to change model.
#         Available gwdg ids (from https://chat-ai.academiccloud.de/v1/models):
#           apertus-70b-instruct-2509, qwen3.5-122b-a10b, glm-4.7, devstral-2-123b-instruct-2512,
#           qwen3-omni-30b-a3b-instruct, qwen3-coder-next, qwen3.6-35b-a3b, qwen3.6-27b,
#           gemma-4-31b-it, mistral-large-3-675b-instruct-2512, qwen3.5-397b-a17b,
#           meta-llama-3.1-8b-instruct, openai-gpt-oss-120b, qwen3-30b-a3b-instruct-2507,
#           medgemma-27b-it
ciim_agentic:        { claude: sonnet, pi: gwdg/qwen3-coder-next }
study_designer_agent:{ claude: sonnet, pi: gwdg/qwen3-coder-next }
data_analyst_agent:  { claude: sonnet, pi: gwdg/qwen3-coder-next }
peer_reviewer_agent: { claude: opus,   pi: gwdg/qwen3-coder-next }
feedback_analyser:   { claude: sonnet, pi: gwdg/qwen3-coder-next }
curate_paper:        { claude: sonnet, pi: gwdg/qwen3-coder-next }
knowhow_audit:      { claude: opus, pi: gwdg/qwen3-coder-next }
rubric_agent:        { claude: opus,   pi: gwdg/qwen3-coder-next }
